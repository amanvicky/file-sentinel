[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-sentinel"
version = "0.1.0"
description = "Real-time file-integrity watching with a ransomware canary - SHA-256 baselines, live diffs, burst alerts"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aman Elugam" }]

[project.scripts]
file-sentinel = "sentinel:main"
